[project]
name = "ai-design-studio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["backend", "backend/src"]
testpaths = ["backend/tests"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

ignore = [
    "E501", # line too long - formatter handles this
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"